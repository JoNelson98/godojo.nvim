  - Finding elements that sum to a target value.
invariant: |
  The hash map holds the correct current counts or index mappings.
skeleton: |
  // Generic Template: Hash Tracker (Frequency Counting / Mappings) in Go
  func hashTrackerTemplate(items []int) {
      // Create hash map to track occurrences, indices, or presence
      tracker := make(map[int]int)

      for idx, val := range items {
          // 1. Query map to check existence or constraints in O(1) avg time
          if _, exists := tracker[val]; exists {
              // Process matching case
          }

          // 2. Update map state with current index or frequency count
          tracker[val] = idx
      }
  }
time_complexity: O(n)
space_complexity: O(n)
mistakes:
