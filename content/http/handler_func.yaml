id: http.handler_func.001
title: Convert Function to HandlerFunc
chapter: http
pattern_id: http.handler_func
difficulty: 2
type: full_recall
prompt: |
    Convert the regular function `myFunc` into a `http.Handler` using `http.HandlerFunc`.
starter: |
    package challenge

    import (
        "net/http"
    )

    func myFunc(w http.ResponseWriter, r *http.Request) {
        w.WriteHeader(http.StatusOK)
    }

    func getHandler() http.Handler {
        // godojo:start
        // Write your solution here.
        // godojo:end
    }
validation:
    compile: true
    gofmt: true
    tests:
        - TestGetHandler
    ast_rules: []
feedback:
    wrong_adapter: |
        Cast `myFunc` to `http.HandlerFunc` to turn it into an object that satisfies the `http.Handler` interface.
hints:
    - Use `http.HandlerFunc(myFunc)` to perform the conversion.
explanation: |
    The `http.HandlerFunc` type is an adapter that allows ordinary functions to be used as HTTP handlers. If `f` has the right signature, `http.HandlerFunc(f)` is an `http.Handler` that calls `f`.
test_code: |
    package challenge

    import (
        "net/http"
        "net/http/httptest"
        "testing"
    )

    func TestGetHandler(t *testing.T) {
        h := getHandler()
        if h == nil {
            t.Fatal("handler is nil")
        }
        rec := httptest.NewRecorder()
        req := httptest.NewRequest("GET", "/", nil)
        h.ServeHTTP(rec, req)

        if rec.Code != http.StatusOK {
            t.Errorf("expected status %d, got %d", http.StatusOK, rec.Code)
        }
    }
