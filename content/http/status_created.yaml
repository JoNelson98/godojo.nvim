id: http.status_created.001
title: Write StatusCreated Header
chapter: http
pattern_id: http.status_created
difficulty: 2
type: full_recall
prompt: |
    Write an HTTP status code 201 Created to the response using `http.StatusCreated` in the provided handler.
starter: |
    package challenge

    import (
        "net/http"
    )

    func createdHandler(w http.ResponseWriter, r *http.Request) {
        // godojo:start
        // Write your solution here.
        // godojo:end
    }
validation:
    compile: true
    gofmt: true
    tests:
        - TestCreatedHandler
    ast_rules: []
feedback:
    missing_created: |
        You must call `w.WriteHeader(http.StatusCreated)` to signal successful resource creation.
hints:
    - Use `w.WriteHeader(http.StatusCreated)`.
explanation: |
    The HTTP `201 Created` success status response code indicates that the request has succeeded and has led to the creation of a new resource. Use `w.WriteHeader(http.StatusCreated)`.
test_code: |
    package challenge

    import (
        "net/http"
        "net/http/httptest"
        "testing"
    )

    func TestCreatedHandler(t *testing.T) {
        rec := httptest.NewRecorder()
        req := httptest.NewRequest("POST", "/", nil)
        createdHandler(rec, req)

        if rec.Code != http.StatusCreated {
            t.Errorf("expected status %d, got %d", http.StatusCreated, rec.Code)
        }
    }
