id: http.status_ok.001
title: Write StatusOK Header
chapter: http
pattern_id: http.status_ok
difficulty: 1
type: full_recall
prompt: |
    In the given HTTP handler, set the HTTP response status code to 200 OK using `http.StatusOK`.
starter: |
    package challenge

    import (
        "net/http"
    )

    func okHandler(w http.ResponseWriter, r *http.Request) {
        // godojo:start
        // Write your solution here.
        // godojo:end
    }
validation:
    compile: true
    gofmt: true
    tests:
        - TestOkHandler
    ast_rules: []
feedback:
    missing_status: |
        Make sure to call `w.WriteHeader(http.StatusOK)` before writing any content.
hints:
    - Use `w.WriteHeader(http.StatusOK)`.
explanation: |
    `w.WriteHeader` sends an HTTP response header with the provided status code. If not called explicitly, the first call to `Write` will trigger an implicit `WriteHeader(http.StatusOK)`.
test_code: |
    package challenge

    import (
        "net/http"
        "net/http/httptest"
        "testing"
    )

    func TestOkHandler(t *testing.T) {
        rec := httptest.NewRecorder()
        req := httptest.NewRequest("GET", "/", nil)
        okHandler(rec, req)

        if rec.Code != http.StatusOK {
            t.Errorf("expected status %d, got %d", http.StatusOK, rec.Code)
        }
    }
