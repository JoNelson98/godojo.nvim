id: boss.post_companies.001
title: POST /companies Boss Mission
chapter: boss
pattern_id: boss.post_companies
difficulty: 5
type: full_recall
prompt: |
    Combine your net/http handlers, JSON serialization, and unit testing knowledge into a final Boss Mission.

    Requirements:
    1. Build a Handler: `HandleCreateCompany` that serves `POST /companies`.
       - Accept JSON with a `name` field (mapped to `CreateCompanyRequest`).
       - Reject malformed JSON with HTTP status code `400 Bad Request`.
       - Return HTTP status code `201 Created` on success.
       - Respond with JSON containing the company name (mapped to `CreateCompanyResponse`).
       - Set the `Content-Type` header to `application/json`.
    2. Write Handler Tests: Complete `TestHandleCreateCompany_Valid` and `TestHandleCreateCompany_Invalid`.
       - Use `httptest.NewRecorder` and `httptest.NewRequest`.
       - Test that a valid request returns status 201 and correct name.
       - Test that an invalid request returns status 400.
